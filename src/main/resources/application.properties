spring.application.name=backend

# H2 (file based, persistent across restarts)
spring.datasource.url=jdbc:h2:file:./data/hemopharm;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.web.error.include-message=always

# OCR (Tess4J) — comma-separated tesseract language packs from the tessdata folder.
# mkd reads Cyrillic names; eng recovers Latin ones (ALT, AST, pH) that mkd misreads.
app.ocr.language=mkd,eng
# Optional: override auto-detected tessdata folder
# app.ocr.datapath=/opt/homebrew/share/tessdata

# Laboratory name written on extracted reports
app.lab.name=\u0408\u0417\u0423 \u041f\u043e\u043b\u0438\u043a\u043b\u0438\u043d\u0438\u043a\u0430 \u0416\u0435\u043b\u0435\u0437\u0430\u0440\u0430 - \u0421\u043a\u043e\u043f\u0458\u0435
